<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3352C4">
<title>Aportes Parroquiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Diseño: app de una columna tipo celular, tarjetas redondeadas, barra de pestañas abajo para tesoreros y guía */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1C2233; --muted:#646C80; --line:#E3E6EF;
  --brand:#3352C4; --brand-ink:#FFFFFF; --brand-soft:#E6EBFB; --brand-deep:#23398F;
  --sun:#F2B33D; --sun-soft:#FDF1D8;
  --ok:#1E8A55; --ok-soft:#DDF3E7; --warn:#B26A00; --warn-soft:#FCEBCF; --bad:#C23B3B; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(28,34,51,.05),0 6px 18px rgba(28,34,51,.06);
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10131C; --surface:#191E2B; --ink:#E9ECF4; --muted:#A0A8BB; --line:#2A3142;
  --brand:#7D96F0; --brand-ink:#0E1430; --brand-soft:#232D4F; --brand-deep:#5672D9;
  --sun:#F2B33D; --sun-soft:#3A2F17;
  --ok:#5CC98F; --ok-soft:#163626; --warn:#EDAA4E; --warn-soft:#3A2A12; --bad:#EE8080; --bad-soft:#3D1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}

/* Encabezado */
.head{display:flex;align-items:center;gap:12px;padding:4px 0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:900;flex:none}
.avatar.sm{width:36px;height:36px;font-size:.85rem}
.avatar.sun{background:var(--sun);color:#3A2A05}
.head .who{flex:1;min-width:0}
.head .who b{display:block;font-size:1.15rem;font-weight:800;line-height:1.2}
.head .who span{font-size:.85rem;color:var(--muted)}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}

/* Tarjetas */
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:1.08rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .ico{color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:.87rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.debt{color:var(--bad);font-weight:800} .paid{color:var(--ok);font-weight:800}

/* Tarjeta principal */
.hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px rgba(51,82,196,.25)}
@media (prefers-color-scheme: dark){.hero{color:#fff;background:linear-gradient(140deg,#3352C4,#23398F)}}
.hero .lbl{font-size:.9rem;opacity:.85;font-weight:600}
.hero .big{font-size:2.6rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.hero .chip{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:center}
.hero .chip.ok{background:#E6F7EE;color:#14663F} .hero .chip.bad{background:#FFE7E7;color:#9C2727}
.hero .btn{background:#fff;color:#23398F}

/* Botones */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:1rem;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;min-height:48px}
.btn.block{width:100%}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff}
.btn.wa{background:#25A35A;color:#fff}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--brand);padding:8px 10px;min-height:0}
.btn.sm{padding:9px 12px;min-height:40px;font-size:.92rem;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.mem:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}

/* Formularios */
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:700}
input,select{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:1rem;color:var(--ink)}
input:focus,select:focus{border-color:var(--brand);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.file{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);cursor:pointer;text-align:center}
.file.has{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.file input{display:none}
.err{color:var(--bad);font-weight:700;font-size:.92rem}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list>.item:first-child,.list>.mem-wrap:first-child{border-top:0}
.item .l{flex:1;min-width:0}
.item .t{font-weight:800}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.ic.sun{background:var(--sun-soft);color:var(--warn)} .ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.bad{background:var(--bad-soft);color:var(--bad)}
.pill{font-size:.75rem;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--brand-soft);color:var(--brand)}
.pill.off{background:var(--line);color:var(--muted)}
.mem-wrap{border-top:1px solid var(--line)}
.mem{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:12px 0;color:inherit}
.mem .chev{color:var(--muted);transition:transform .2s}
.mem[aria-expanded="true"] .chev{transform:rotate(180deg)}
.det{display:flex;flex-direction:column;gap:12px;padding:4px 0 18px}
.det h3{font-size:.95rem;font-weight:800;margin:6px 0 0}
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* Cuotas */
.cuotas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cuota{border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.cuota .ico{width:16px;height:16px}
.cuota.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cuota.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.estado{border-radius:14px;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.estado.ok{background:var(--ok-soft);color:var(--ok)} .estado.bad{background:var(--bad-soft);color:var(--bad)} .estado.neutral{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.stat{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.1rem;font-weight:900;font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--ok);border-radius:99px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:.85rem;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:.78rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Pestañas abajo */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:15}
.tabs .in{display:flex;max-width:600px;width:100%}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;border-radius:12px;position:relative}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:.65rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* Hoja inferior (formularios) */
.sheet-bg{position:fixed;inset:0;background:rgba(16,19,28,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:1.2rem;font-weight:900}
.receipt{background:var(--bg);border-radius:14px;padding:14px;font-size:.9rem;white-space:pre-wrap;font-family:inherit}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:700;color:var(--ink);flex-direction:row;font-size:1rem}
.check input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.check:first-child{border-top:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem;max-width:90vw;z-index:40;box-shadow:var(--shadow)}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .logo{width:64px;height:64px;border-radius:20px;background:var(--brand);color:#fff;display:grid;place-items:center}
.login .logo .ico{width:32px;height:32px}
.login h1{font-size:1.8rem;font-weight:900;margin:0;line-height:1.15;text-wrap:balance}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;color:var(--muted);text-align:center}
.empty .ic{width:48px;height:48px;border-radius:16px}
.sec-title{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 4px -4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
// ===== Conexión =====
const SUPABASE_URL = "https://hrqoghervpbwjbeclbwz.supabase.co";
const SUPABASE_KEY = "sb_publishable_jOVgmqIM8XINypWnhVaBOA_JofJPGoR";

// ===== Utilidades =====
const $ = id => document.getElementById(id);
const fmt = n => "$ " + Math.round(Number(n)||0).toLocaleString("es-AR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = (n, cls="") => `<svg class="ico ${cls}"><use href="#i-${n}"/></svg>`;
const ini = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const primer = n => String(n||"").trim().split(" ")[0];
const plural = (n,c) => `${n} ${n===1?c.unidad:c.unidad_plural}`;
function telWA(t){
  let d = String(t||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("0")) d = d.slice(1);
  if(d.length===10) d = "549"+d;                 // 381 5550101 -> 549 381 5550101
  else if(d.startsWith("54") && !d.startsWith("549")) d = "549"+d.slice(2);
  return d;
}
const waLink = (tel, txt) => `https://wa.me/${telWA(tel)}?text=${encodeURIComponent(txt)}`;

async function ocupado(btn, fn){ if(btn) btn.disabled=true; try{ return await fn() } finally { if(btn) btn.disabled=false } }

async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", headers:{ "apikey":SUPABASE_KEY, "Content-Type":"application/json" }, body: JSON.stringify(args)
  });
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.message || "No se pudo conectar. Revisá tu internet y probá de nuevo.");
  return j;
}
async function fnComprobantes(body){
  const isForm = body instanceof FormData;
  const r = await fetch(`${SUPABASE_URL}/functions/v1/comprobantes`, {
    method:"POST",
    headers: isForm ? { "apikey":SUPABASE_KEY } : { "apikey":SUPABASE_KEY, "Content-Type":"application/json" },
    body: isForm ? body : JSON.stringify(body)
  });
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error || "No se pudo conectar. Probá de nuevo.");
  return j;
}
// Achica las fotos antes de subirlas (ahorra espacio y datos)
async function comprimir(file){
  if(!file.type.startsWith("image/") || /heic|heif/i.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.72));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type:"image/jpeg"});
  }catch(_){ return file; }
}

function abrirHoja(html, onMount){

  const cerrar = () => { bg.remove(); document.body.style.overflow = ""; };
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-cerrar]")) cerrar(); });
  $("sheetRoot").appendChild(bg); document.body.style.overflow = "hidden";
  onMount && onMount(bg.querySelector(".sheet"), cerrar);
  const f = bg.querySelector("input,select"); if(f) setTimeout(()=>f.focus(), 50);
  return cerrar;
}

function estadoAporte(a){
  if(a.meses_vencidos===0) return {cls:"neutral", ic:"clock", txt:`Las cuotas empiezan en ${a.mes_desde}.`};
  if(a.falta_anio<=0) return {cls:"ok", ic:"award", txt:"¡Año cancelado! Gracias."};
  if(a.al_dia) return {cls:"ok", ic:"check", txt: a.adelantado>0 ? `Al día a ${a.mes_actual}, con ${fmt(a.adelantado)} adelantado.` : `Al día a ${a.mes_actual}.`};
  return {cls:"bad", ic:"alert", txt:`Debe ${a.cuotas_atrasadas} ${a.cuotas_atrasadas===1?"cuota":"cuotas"} (${fmt(a.atraso)}) a ${a.mes_actual}.`};
}
function aporteHTML(a, propio){
  const n = a.meses_total, inicio = MES_N[a.mes_desde] || 3;

// ===== Recibo =====
function textoRecibo(r){
  const det = r.cuenta.conceptos.filter(c=>c.saldo>0).map(c=>`• ${c.nombre}: ${fmt(c.saldo)}`).join("\n");
  return `*${r.parroquia}* · Recibo N° ${r.recibo_nro}\n${r.miembro}\nFecha: ${r.fecha} · ${r.medio}\nConcepto: ${r.concepto}\nMonto recibido: *${fmt(r.monto)}*\n\nSaldo pendiente: ${fmt(r.cuenta.saldo)}` +
    (det ? "\n"+det : "\n¡Estás al día! Gracias.") +
    `\n\nAporte anual: ${estadoAporte(r.cuenta.aporte).txt}\nFalta para cancelar el año: ${fmt(r.cuenta.aporte.falta_anio)}` +
    `\n\nTu cuenta y carga de comprobantes:\n${linkPersonal(r.cuenta.miembro.codigo)}`;
}
function hojaRecibo(r){
  const txt = textoRecibo(r);
  abrirHoja(`<div class="estado ok">${I("check")}<span>Pago aprobado · Recibo N° ${r.recibo_nro}</span></div>
    <div class="muted small">${r.email?`${I("mail","sm")} El recibo se envía solo por mail a <b>${esc(r.email)}</b>.`:`${I("alert","sm")} Este dirigente no tiene mail cargado: pedile al guía que lo agregue.`}</div>
    <div class="receipt">${esc(txt)}</div>
    <div class="actions">${r.celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(r.celular, txt)}">${I("msg")} Enviar por WhatsApp</a>`:""}
      <button class="btn soft" data-copiar>${I("copy")} Copiar</button></div>
    <button class="btn ghost" data-cerrar>Cerrar</button>`,
  (s)=>{ s.querySelector("[data-copiar]").onclick = async ()=>{ try{await navigator.clipboard.writeText(txt);toast("Recibo copiado")}catch(_){toast("No se pudo copiar")} }; });
}
function hojaLink(nombre, celular, codigo, esTesorero){
  const link = linkPersonal(codigo);
  const msg = esTesorero
    ? `Hola ${primer(nombre)}, este es tu acceso como tesorero a la app de aportes. No lo compartas:\n${link}`
    : `Hola ${primer(nombre)}, este es tu link personal para ver tu cuenta de aportes y subir comprobantes. No lo compartas:\n${link}`;
  abrirHoja(`<h2>Acceso de ${esc(nombre)}</h2>
    <div class="receipt" style="word-break:break-all">${esc(link)}</div>
    <div class="muted small">Código: <b>${esc(codigo)}</b>. Si alguien más lo conoce, generá uno nuevo: el anterior deja de funcionar.</div>
    <div class="actions">${celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(celular,msg)}">${I("msg")} Enviar por WhatsApp</a>`:""}
      <button class="btn soft" data-copiar>${I("copy")} Copiar link</button></div>
    <button class="btn ghost" data-regenerar>${I("key","sm")} Generar código nuevo</button>
    <button class="btn ghost" data-cerrar>Cerrar</button>`,
  (s, cerrar)=>{
    s.querySelector("[data-copiar]").onclick = async ()=>{ try{await navigator.clipboard.writeText(link);toast("Link copiado")}catch(_){toast("No se pudo copiar")} };
    s.querySelector("[data-regenerar]").onclick = async ()=>{
      cerrar();
      if(!await confirmar("¿Generar código nuevo?", `El link actual de ${esc(nombre)} va a dejar de funcionar y vas a tener que mandarle el nuevo.`, "Generar")) return;
      try{
        const tipo = esTesorero?"tesorero":"miembro";
        const lista = esTesorero?S.panel.tesoreros:S.panel.miembros;
        const it = lista.find(x=>x.codigo===codigo);
        const nuevo = await rpc("regenerar_codigo",{p_codigo:S.codigo,p_tipo:tipo,p_id:it.id});
        if(codigo===S.codigo){ S.codigo = nuevo; store("aportes_codigo", nuevo); }
        await recargar(); hojaLink(nombre, celular, nuevo, esTesorero);
      }catch(e){ toast(e.message) }
    };
  });
}

function calcTotal(){

  if($("aTotal")) $("aTotal").value = ev ? fmt((Number($("aCant").value)||0)*ev.precio) : "";

function montarTesorero(){
  const m = $("vMain");
  m.querySelector("[data-salir]").onclick = salir;
  m.onclick = async e => {
    const b = e.target.closest("button,[data-mem]"); if(!b) return;
    const ds = b.dataset;
    if(ds.tabgo){ S.tab=ds.tabgo; render(); return; }
    if(ds.ver) return ocupado(b, async()=>{ try{ const {url} = await fnComprobantes({accion:"ver",codigo:S.codigo,pago_id:Number(ds.ver)});
        const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; a.className="btn soft sm"; a.innerHTML=`${I("file","sm")} Abrir ↗`; b.replaceWith(a); a.click(); }catch(er){ toast(er.message) } });
    if(ds.ok) return ocupado(b, async()=>{ try{ const r = await rpc("verificar_pago",{p_codigo:S.codigo,p_pago:Number(ds.ok),p_aprobar:true}); await recargar(); hojaRecibo(r); }catch(er){ toast(er.message) } });
    if(ds.no){ if(!await confirmar("¿Rechazar el comprobante?","El pago no se suma a la cuenta del dirigente. Avisale por qué lo rechazaste.","Rechazar")) return;
      return ocupado(b, async()=>{ try{ await rpc("verificar_pago",{p_codigo:S.codigo,p_pago:Number(ds.no),p_aprobar:false}); await recargar(); toast("Comprobante rechazado"); }catch(er){ toast(er.message) } }); }
    if(ds.filtro){ S.filtro=ds.filtro; render(); return; }
    if(ds.sub){ S.sub=ds.sub; render(); scrollTo({top:0}); return; }
    if(ds.reenviar) return ocupado(b, async()=>{ try{ await rpc("reenviar_recibo",{p_codigo:S.codigo,p_pago:Number(ds.reenviar)}); toast("Recibo reenviado por mail"); }catch(er){ toast(er.message) } });
    if(ds.mem!==undefined && b.classList.contains("mem")) return abrirDetalle(b);
    // Gestión
    const P = S.panel;
    if(ds.nuevoTes!==undefined) return hojaTesorero(null);
    if(ds.editTes) return hojaTesorero(P.tesoreros.find(x=>x.id==ds.editTes));
    if(ds.asig) return hojaAsignar(P.tesoreros.find(x=>x.id==ds.asig));
    if(ds.linkTes){ const t=P.tesoreros.find(x=>x.id==ds.linkTes); return hojaLink(t.nombre,t.celular,t.codigo,true); }
    if(ds.bajaTes){ const t=P.tesoreros.find(x=>x.id==ds.bajaTes), act = ds.activo==="true";
      if(act && !await confirmar(`¿Dar de baja a ${t.nombre}?`, `Su código deja de funcionar y sus ${t.miembros} dirigentes quedan sin tesorero hasta que los asignes a otro.`, "Dar de baja")) return;
      return ocupado(b, async()=>{ try{ const r=await rpc("set_tesorero_activo",{p_codigo:S.codigo,p_id:t.id,p_activo:!act}); await recargar(); toast(act?`Dado de baja. ${r.liberados} dirigentes quedaron sin tesorero.`:"Reactivado"); }catch(er){ toast(er.message) } }); }
    if(ds.nuevoMem!==undefined) return hojaMiembro(null);
    if(ds.editMem) return hojaMiembro(P.miembros.find(x=>x.id==ds.editMem));
    if(ds.linkMem){ const x=P.miembros.find(y=>y.id==ds.linkMem); return hojaLink(x.nombre,x.celular,x.codigo,false); }
    if(ds.bajaMem){ const x=P.miembros.find(y=>y.id==ds.bajaMem), act = ds.activo==="true";
      if(act && !await confirmar(`¿Dar de baja a ${x.nombre}?`, "Deja de aparecer en las listas, no recibe recordatorios y su link deja de funcionar. Su historial se guarda y lo podés reactivar.", "Dar de baja")) return;
      return ocupado(b, async()=>{ try{ await rpc("set_miembro_activo",{p_codigo:S.codigo,p_id:x.id,p_activo:!act}); await recargar(); toast(act?"Dirigente dado de baja":"Dirigente reactivado"); }catch(er){ toast(er.message) } }); }
    if(ds.nuevoEv!==undefined) return hojaEvento(null);
    if(ds.editEv) return hojaEvento(P.eventos.find(x=>x.id==ds.editEv));
    if(ds.bajaEv){ const act = ds.activo==="true";
      return ocupado(b, async()=>{ try{ await rpc("set_evento_activo",{p_codigo:S.codigo,p_id:Number(ds.bajaEv),p_activo:!act}); await recargar(); toast(act?"Evento cerrado: ya no se puede entregar":"Evento reabierto"); }catch(er){ toast(er.message) } }); }
  };
  m.onchange = async e => {
    const sel = e.target.closest("[data-cambiar-tes]"); if(!sel) return;
    try{ await rpc("asignar_tesorero",{p_codigo:S.codigo,p_miembro:Number(sel.dataset.cambiarTes),p_tesorero:sel.value?Number(sel.value):null}); await recargar(); toast("Tesorero asignado"); }catch(er){ toast(er.message) }
  };
  const busca = $("busca");
  if(busca){ busca.oninput = ()=>{ S.busca = busca.value; const pos = busca.selectionStart; render(); const nb=$("busca"); nb.focus(); nb.setSelectionRange(pos,pos); }; }
  if($("aEvento")){ $("aEvento").onchange=calcTotal; $("aCant").oninput=calcTotal; calcTotal(); }
  if($("eGuardar")) $("eGuardar").onclick = () => ocupado($("eGuardar"), async ()=>{
    const monto = Number($("eMonto").value); if(!(monto>0)){ toast("Escribí el monto recibido"); return; }
    try{ const r = await rpc("registrar_efectivo",{p_codigo:S.codigo,p_miembro:Number($("eMiembro").value),p_evento:$("eConcepto").value?Number($("eConcepto").value):null,p_monto:monto});
      await recargar(); hojaRecibo(r); }catch(er){ toast(er.message) }
  });
  if($("aGuardar")) $("aGuardar").onclick = () => ocupado($("aGuardar"), async ()=>{
    const cant = Number($("aCant").value); if(!(cant>0)){ toast("Escribí una cantidad"); return; }
    const nom = $("aMiembro").selectedOptions[0]?.textContent || "";
    try{ await rpc("asignar_evento",{p_codigo:S.codigo,p_miembro:Number($("aMiembro").value),p_evento:Number($("aEvento").value),p_cantidad:cant}); await recargar(); toast(`Asignado a ${nom}`); }catch(er){ toast(er.message) }
  });
  if($("btnProbar")) $("btnProbar").onclick = () => ocupado($("btnProbar"), async ()=>{
    try{ await rpc("probar_mail",{p_codigo:S.codigo,p_destino:$("mailPrueba").value}); toast("Prueba enviada. Revisá tu casilla (y spam) en un minuto."); }catch(er){ toast(er.message) }
  });
  if($("btnRecordar")) $("btnRecordar").onclick = async () => {
    if(!await confirmar("¿Enviar recordatorio ahora?","A cada dirigente que debe le llega un mail con su estado de cuenta. Además, esto sale solo los días 1 y 16 de cada mes.","Enviar","")) return;
    ocupado($("btnRecordar"), async ()=>{ try{ const r = await rpc("enviar_recordatorios_ahora",{p_codigo:S.codigo}); toast(`Se están enviando ${r.encolados} recordatorios`); }catch(er){ toast(er.message) } });
  };
  if($("btnHist")) $("btnHist").onclick = () => ocupado($("btnHist"), async ()=>{
    try{ const ns = await rpc("notificaciones_recientes",{p_codigo:S.codigo}); const box=$("histMails"); box.hidden=false;
      const est = {enviado:'<span class="pill ok">Enviado</span>', pendiente:'<span class="pill warn">Enviando</span>', error:'<span class="pill bad">Error</span>', sin_mail:'<span class="pill off">Sin mail</span>'};
      const tipo = {recibo:"Recibo", recordatorio:"Recordatorio", prueba:"Prueba"};
      box.innerHTML = ns.length ? ns.map(n=>`<div class="item"><div class="ic">${I("mail")}</div><div class="l"><div class="t">${tipo[n.tipo]} · ${esc(n.miembro||n.destino||"")}</div>
        <div class="muted small">${n.fecha}${n.destino?` · ${esc(n.destino)}`:""}${n.detalle?` · ${esc(n.detalle)}`:""}</div></div>${est[n.estado]}</div>`).join("") : `<div class="muted small">Todavía no se envió ningún mail.</div>`;
    }catch(er){ toast(er.message) } });
  if($("btnTraspaso")) $("btnTraspaso").onclick = async () => {
    const sel = $("nuevoGuia"); if(!sel.value){ toast("Primero creá o elegí otro tesorero"); return; }
    const nombre = sel.selectedOptions[0].textContent;
    if(!await confirmar(`¿Pasarle el rol de guía a ${nombre}?`, `${esc(nombre)} va a poder ver y gestionar todo. Vos vas a quedar como tesorero común y ya no vas a ver la gestión. No se puede deshacer desde tu cuenta.`, "Pasar el rol")) return;
    ocupado($("btnTraspaso"), async ()=>{
      try{ const r = await rpc("traspasar_guia",{p_codigo:S.codigo,p_nuevo:Number(sel.value)});
        const link = linkPersonal(r.codigo);
        const msg = `Hola ${primer(r.nuevo_guia)}, desde ahora sos el guía del área en la app de aportes. Tu acceso (no lo compartas):\n${link}`;
        await recargar(); S.tab="inicio"; render();
        abrirHoja(`<div class="estado ok">${I("check")}<span>${esc(r.nuevo_guia)} es el nuevo guía</span></div>
          <div class="muted small">Mandale su acceso. Desde su cuenta va a ver la pestaña Gestión.</div>
          <div class="receipt" style="word-break:break-all">${esc(link)}</div>
          ${r.celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(r.celular,msg)}">${I("msg")} Enviar por WhatsApp</a>`:""}
          <button class="btn ghost" data-cerrar>Cerrar</button>`);
      }catch(er){ toast(er.message) }
    });
  };
}
async function abrirDetalle(b){
  const det = b.parentElement.querySelector("[data-det]");
  if(!det.hidden){ det.hidden = true; b.setAttribute("aria-expanded","false"); return; }
  det.hidden = false; b.setAttribute("aria-expanded","true");
  det.innerHTML = `<div class="muted small">Cargando…</div>`;
  try{
    const c = await rpc("cuenta_de",{p_codigo:S.codigo,p_miembro:Number(b.dataset.mem)});
    det.innerHTML = `
      ${aporteHTML(c.aporte, false)}
      <h3>Por concepto · debe hoy <span class="debt num">${fmt(c.saldo)}</span></h3>
      <div class="list">${conceptosHTML(c.conceptos)}</div>
      <h3>Historial de pagos</h3>
      <div class="list">${pagosHTML(c.pagos, true)}</div>
      <div class="actions"><button class="btn soft sm" data-link-det>${I("msg","sm")} Enviarle su link</button></div>`;
    det.querySelector("[data-link-det]").onclick = (ev) => { ev.stopPropagation();
      const link = linkPersonal(c.miembro.codigo);
      const msg = `Hola ${primer(c.miembro.nombre)}, este es tu link personal para ver tu cuenta de aportes y subir comprobantes. No lo compartas:\n${link}`;
      abrirHoja(`<h2>Link de ${esc(c.miembro.nombre)}</h2><div class="receipt" style="word-break:break-all">${esc(link)}</div>
        <div class="actions">${c.miembro.celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(c.miembro.celular,msg)}">${I("msg")} Enviar por WhatsApp</a>`:""}<button class="btn soft" data-cerrar>Cerrar</button></div>`);
    };
  }catch(err){ det.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}

// ===== Inicio =====
$("btnEntrar").onclick = ()=>{ const c=$("inCodigo").value.trim(); if(c){ $("loginErr").hidden=true; entrar(c); } };
$("inCodigo").onkeydown = e => { if(e.key==="Enter") $("btnEntrar").click(); };
const desdeLink = new URLSearchParams(location.search).get("c");
const inicial = desdeLink || read("aportes_codigo");
if(inicial) entrar(inicial); else mostrar("vLogin");
</script>
